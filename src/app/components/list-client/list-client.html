<section>
  <h2>CLIENTS!</h2>

  <ul>    
    @for (item of clients; track item.id) {
      <li>
        <strong>{{item.name}}</strong><br>
        Address: {{item.address}}<br>
        Email: {{item.email}}<br>
        Phone: {{item.phone}}<br>

        <button (click)="onDelete(item.id!)">
          Delete
        </button>
      </li>
    }
  </ul>
</section>

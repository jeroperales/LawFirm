<section class="page">
  <div class="card">

    <div class="header-row">
      <h2>Cases</h2>
      <span class="count">{{ cases.length }} total</span>
    </div>

    <div class="list">

      @for (item of cases; track item.id) {
        <div class="list-item">

          <div class="info">
            <div class="name">{{ item.title }}</div>

            <div class="details">
              <span>{{ item.caseNumber }}</span>
              <span>{{ item.startDate }}</span>
              <span>{{ item.status }}</span>
            </div>
          </div>

        </div>
      }

    </div>

  </div>
</section>

@if (cases.length === 0) {
  <div class="empty">
    No cases yet.
  </div>
}

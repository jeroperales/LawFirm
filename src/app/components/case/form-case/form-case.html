<form [formGroup]="caseForm" (ngSubmit)="submit()" class="case-form">

  <h2>Create New Case</h2>

  <!-- TITLE -->
  <div class="form-group">
    <label>Title</label>
    <input type="text" formControlName="title" />
    
    <small *ngIf="caseForm.get('title')?.invalid && caseForm.get('title')?.touched">
      Title is required
    </small>
  </div>

  <!-- CASE NUMBER -->
  <div class="form-group">
    <label>Case Number</label>
    <input type="text" formControlName="caseNumber" />

    <small *ngIf="caseForm.get('caseNumber')?.invalid && caseForm.get('caseNumber')?.touched">
      Case number is required
    </small>
  </div>

  <!-- DESCRIPTION -->
  <div class="form-group">
    <label>Description</label>
    <textarea formControlName="description"></textarea>
  </div>

  <!-- STATUS -->
  <div class="form-group">
    <label>Status</label>
    <select formControlName="status">
      <option value="OPEN">Open</option>
      <option value="PENDING">Pending</option>
      <option value="CLOSED">Closed</option>
    </select>
  </div>

  <!-- PRIORITY -->
  <div class="form-group">
    <label>Priority</label>
    <select formControlName="priority">
      <option value="LOW">Low</option>
      <option value="MEDIUM">Medium</option>
      <option value="HIGH">High</option>
    </select>
  </div>

  <!-- TYPE -->
  <div class="form-group">
    <label>Case Type</label>
    <input type="text" formControlName="type" placeholder="e.g. Criminal, Civil..." />
  </div>

  <!-- START DATE -->
  <div class="form-group">
    <label>Start Date</label>
    <input type="date" formControlName="startDate" />
  </div>

  <!-- CLIENT MULTI-SELECT -->
  <div class="form-group">
    <label>Assign Clients</label>

    <select formControlName="clientIds" multiple>
      <option *ngFor="let client of clients" [value]="client.id">
        {{ client.name }} {{ client.nationality }}
      </option>
    </select>

    <small>Select one or more clients</small>
  </div>

  <!-- BUTTON -->
  <button type="submit" [disabled]="caseForm.invalid">
    Create Case
  </button>

</form>
